version: '3.9'

networks:
  carteira_network:
    driver: bridge

services:
  mysql:
    image: mysql:8.1
    container_name: carteira_mysql
    restart: unless-stopped
    networks:
      - carteira_network
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carteira_virtual
      MYSQL_TCP_PORT: 3306
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # O ping agora utiliza usuário e senha para garantir um teste real
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: carteira_backend
    networks:
      - carteira_network
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: carteira_mysql # Redirecionado para o nome do contêiner
      DB_PORT: 3306
      DB_DATABASE: carteira_virtual
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_node_modules:/var/www/html/node_modules
    working_dir: /var/www/html
    command: ["php","artisan","serve","--host=0.0.0.0","--port=8000"]

volumes:
  mysql_data:
  backend_vendor:
  backend_node_modules: